<!doctype html>
<html><head><meta charset="utf-8"><style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4efe3;color:#1d1a15}
  /* ToastViewport: fixed bottom-24 right-0 z-[100] flex max-h-screen w-full flex-col-reverse p-4 sm:right-4 sm:flex-col md:max-w-[360px] */
  .viewport{position:fixed;bottom:6rem;right:1rem;z-index:100;display:flex;max-height:100vh;width:100%;flex-direction:column;padding:1rem;max-width:360px}
  /* Toast: relative flex w-full items-center justify-between space-x-4 overflow-hidden rounded-md border p-4 pr-8 */
  .toast{position:relative;display:flex;width:100%;align-items:center;justify-content:space-between;overflow:hidden;border-radius:0.375rem;border:1px solid #d8d0bd;background:#fbf8f0;padding:1rem;padding-right:2rem}
  .toast > * + *{margin-left:1rem}
  .grid1{display:grid;gap:0.25rem}
  .title{font-size:0.875rem;line-height:1.25rem;font-weight:600}
  .desc{font-size:0.875rem;line-height:1.25rem;color:#6b6459}
</style></head>
<body>
<div class="viewport">
  <div class="toast" id="t">
    <div class="grid1" id="g">
      <div class="title">播放失败：不支持的格式</div>
      <div class="desc" id="d">错误码 4
http://192.168.1.100:4533/rest/stream?id=a1b2c3d4e5f60718293a4b5c6d7e8f90&u=niko&t=9f8e7d6c5b4a39281706f5e4d3c2b1a0&s=1122334455667788...</div>
    </div>
  </div>
</div>
<script>
window.measure = function(){
  const t=document.getElementById('t'), g=document.getElementById('g'), d=document.getElementById('d');
  const tr=t.getBoundingClientRect(), gr=g.getBoundingClientRect(), dr=d.getBoundingClientRect();
  // walk text to find how many chars of the URL are inside the toast's visible box
  const node = d.firstChild ? d.childNodes[0] : null;
  const text = d.textContent;
  const range = document.createRange();
  let lastVisible = -1;
  for (let i=0;i<text.length;i++){
    range.setStart(d.firstChild, i); range.setEnd(d.firstChild, i+1);
    const r = range.getBoundingClientRect();
    if (r.right <= tr.right && r.left >= tr.left) lastVisible = i;
  }
  let visible='';
  for (let i=0;i<text.length;i++){
    range.setStart(d.firstChild, i); range.setEnd(d.firstChild, i+1);
    const r = range.getBoundingClientRect();
    if (r.right <= tr.right + 0.5 && r.left >= tr.left - 0.5) visible += text[i];
  }
  return {toastW:tr.width, gridW:gr.width, descW:dr.width, descH:dr.height, overflowsToast: gr.right > tr.right, visibleText: visible, fullLen: text.length};
};
</script>
</body></html>
