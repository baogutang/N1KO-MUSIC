<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      两条 theme-color 按配色方案分流。只写一条固定值的话，暗色模式下
      浏览器地址栏 / 安卓状态栏仍是奶油色，和整块墨色版面接不上，
      顶上会横着一条突兀的亮边。值取自 index.css 的 --background。
    -->
    <meta name="theme-color" content="#f4efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1813" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="N1KO MUSIC - 现代化音乐流媒体客户端，支持 Navidrome/Subsonic/Jellyfin/Emby" />
    <title>N1KO MUSIC</title>
    <script src="./theme-preflash.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
