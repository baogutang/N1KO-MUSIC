<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe3" />
    <meta name="description" content="N1KO MUSIC - 现代化音乐流媒体客户端，支持 Navidrome/Subsonic/Jellyfin/Emby" />
    <title>N1KO MUSIC</title>
    <script>
      // 启动防白闪：在 bundle 加载前按持久化主题预置 dark class 与底色（与 index.css --paper 一致）
      try {
        var s = JSON.parse(localStorage.getItem('msp-theme-store') || '{}')
        var t = s && s.state && s.state.theme
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.background = d ? '#1a1712' : '#f4efe3'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
