# N1KO MUSIC 网页版的 nginx 配置（由 Dockerfile 拷到 /etc/nginx/conf.d/default.conf）。
#
# 缓存只有两档例外，其余一律 no-cache（每次复验，有 ETag，没变就是 304）：
#  - /assets/ 的文件名带内容哈希，可以一年 immutable；
#  - /fonts/ /mascots/ /logos/ 不带哈希但很少变，给 7 天。
# 落在「其余」里的包括 index.html、sw.js、workbox-*.js、manifest、runtime-config.json，
# 以及不带哈希的 plugin-sandbox.js / theme-preflash.js / webview-check.js / plugins/**
# ——插件代码不走 Service Worker 预缓存，被浏览器长缓存会拿旧插件当新版本装。
#
# 长缓存头不加 always：404 不该被缓存一年。

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/manifest+json application/xml image/svg+xml;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 默认：每次复验。SPA 路由回落到 index.html 的响应也走这里
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/n1ko-security-headers.conf;
  }

  # 文件名带内容哈希
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/n1ko-security-headers.conf;
  }

  # 不带哈希但很少变
  location ~ ^/(fonts|mascots|logos)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/n1ko-security-headers.conf;
  }
}
