[package]
name = "app"
version = "1.8.1"
description = "N1KO MUSIC - Modern Music Streaming Desktop App"
authors = ["N1KO"]
license = "MIT"
repository = "https://github.com/baogutang/N1KO-MUSIC"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-single-instance = "2"
# n1ko:// 深链接：Windows/Linux 由 single-instance 转发进来，macOS 走系统事件
tauri-plugin-deep-link = "2"
