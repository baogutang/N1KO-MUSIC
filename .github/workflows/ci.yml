name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm run check:versions
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # 带例外清单的审计：未登记的公告仍会让 CI 失败，详见 scripts/audit-allowlist.mjs
      - run: npm run audit:check -- frontend

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run audit:check -- backend
      - run: docker build -t n1ko-music-backend:ci backend

  plugins:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 插件版本核对要比较 base...HEAD，需要历史
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 插件测试与 lint 都借用 frontend 的依赖（crypto-js 等）
      - run: npm ci
        working-directory: frontend
      - run: npm run test:plugins
      - run: npm run lint:plugins
      - name: 插件代码变更必须伴随版本变更（F18）
        run: node scripts/check-plugin-versions.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            apt: true
          - os: macos-latest
            apt: false
          # Windows 此前只在打 tag 的 release.yml 里才编译，PR 里改坏了要到发版才发现
          - os: windows-latest
            apt: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux dependencies
        if: ${{ matrix.apt }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './frontend/src-tauri -> target'
      - run: cargo check --locked
        working-directory: frontend/src-tauri

  # 安卓：只编译自写的 Java（WebDavProxy、LanMediaProxy 等约 1300 行、没有测试），
  # 不签名、不出包、不上传产物；完整打包仍只在 mobile.yml（打 tag）里做。
  # 前置步骤照 mobile.yml 的 android 任务：cap sync 会把网页资源与插件拷进 android/，缺了编不过
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:mobile
        working-directory: frontend
      - run: npx cap sync android
        working-directory: frontend
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21' # Capacitor 8 Android 要求 JDK 21，与 mobile.yml 一致
      - name: Compile Java
        working-directory: frontend/android
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon
